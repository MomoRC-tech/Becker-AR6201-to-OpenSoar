    <path d="M819 272H751L560 310" fill="none" stroke="#344f63" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="828" y="264" font-size="19" font-weight="700">Bare tinned bridge</text>
    <text x="828" y="290" font-size="17">Cups 3 → 7 → 6</text>
    <text x="32" y="488" font-size="17">Leads shown spread out. Keep 4/5 and 8/9 as separate twisted pairs when fitting the harness.</text>
  </g>
</svg>
