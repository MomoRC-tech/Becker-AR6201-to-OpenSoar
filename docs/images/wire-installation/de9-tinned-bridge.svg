<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 390" role="img" aria-labelledby="title desc">
  <title id="title">Tinned bridge on the housing DE-9 solder cups</title>
  <desc id="desc">Rear view of the male housing connector. With five cups on top, the upper row reads 5, 4, 3, 2, 1 from left to right, and the lower row reads 9, 8, 7, 6. Short bare tinned wire joins cup 3 diagonally to cup 7 and then across to cup 6. An insulated black lead from cup 6 goes to GND-J.</desc>
  <defs>
    <linearGradient id="cup" x2="0" y2="1">
      <stop stop-color="#fce4a2"/>
      <stop offset=".55" stop-color="#c49545"/>
      <stop offset="1" stop-color="#a37430"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9Z" fill="#395468"/>
    </marker>
    <g id="solder-cup">
      <rect x="-25" y="-21" width="50" height="42" rx="13" fill="url(#cup)" stroke="#79541a" stroke-width="2"/>
      <rect x="-17" y="-13" width="34" height="26" rx="8" fill="#735222"/>
    </g>
    <g id="joint">
      <ellipse rx="16" ry="12" fill="#b3c1ce" stroke="#536573" stroke-width="2"/>
      <path d="M-8 -5q8 -5 16 0" fill="none" stroke="#f5fbff" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="1040" height="390" fill="#eef4f9"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#142c41">
    <text x="34" y="42" font-size="25" font-weight="700">DE-9 tinned ground bridge</text>
    <text x="34" y="72" font-size="18">Solder-cup side, looking from inside the housing · five-cup row up</text>
    <rect x="53" y="100" width="694" height="221" rx="33" fill="#d5dce2" stroke="#8194a5" stroke-width="2"/>
    <circle cx="81" cy="213" r="12" fill="#eef4f9" stroke="#8194a5" stroke-width="2"/>
    <circle cx="719" cy="213" r="12" fill="#eef4f9" stroke="#8194a5" stroke-width="2"/>
    <path d="M147 115H652Q682 115 672 145L638 277Q632 305 607 305H190Q165 305 159 277L125 145Q115 115 147 115Z" fill="#253a50" stroke="#152c40" stroke-width="2"/>
    <g>
      <use href="#solder-cup" x="200" y="175"/><use href="#solder-cup" x="300" y="175"/>
      <use href="#solder-cup" x="400" y="175"/><use href="#solder-cup" x="500" y="175"/>
      <use href="#solder-cup" x="600" y="175"/><use href="#solder-cup" x="250" y="264"/>
      <use href="#solder-cup" x="350" y="264"/><use href="#solder-cup" x="450" y="264"/>
      <use href="#solder-cup" x="550" y="264"/>
    </g>
    <g text-anchor="middle" font-size="20" font-weight="700" fill="#f8fbff">
      <text x="200" y="143">5</text><text x="300" y="143">4</text>
      <text x="400" y="143">3</text><text x="500" y="143">2</text>
      <text x="600" y="143">1</text><text x="250" y="299">9</text>
      <text x="350" y="299">8</text><text x="450" y="299">7</text>
      <text x="550" y="299">6</text>
    </g>
    <path d="M550 264H751Q769 264 784 277H955" stroke="#070e16" stroke-width="13" fill="none" stroke-linecap="round"/>
    <path d="M550 261H751Q769 261 784 274H952" stroke="#576778" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M400 175L450 264H550" fill="none" stroke="#415566" stroke-width="13" stroke-linejoin="round"/>
    <path d="M400 175L450 264H550" fill="none" stroke="#d5e2ea" stroke-width="8" stroke-linejoin="round"/>
    <path d="M400 173L450 262H550" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
    <use href="#joint" x="400" y="175"/><use href="#joint" x="450" y="264"/><use href="#joint" x="550" y="264"/>
    <path d="M780 145H677L476 256" fill="none" stroke="#eef4f9" stroke-width="6"/>
    <path d="M780 145H677L476 256" fill="none" stroke="#395468" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="790" y="144" font-size="20" font-weight="700">Bare tinned wire</text>
    <text x="790" y="170" font-size="17">Solder at cups 3, 7 and 6</text>
    <text x="790" y="313" font-size="20" font-weight="700">Black lead to GND-J</text>
    <text x="790" y="337" font-size="17">Example takeoff at cup 6</text>
    <text x="34" y="366" font-size="17">Use the moulded cup numbers. Form the wire to the actual cups and keep it clear of adjacent cups and the shell.</text>
  </g>
</svg>
