<svg xmlns="http://www.w3.org/2000/svg" width="930" height="365" viewBox="0 0 930 365" role="img" aria-labelledby="title desc">
<title id="title">Classic FLARM through RS-232-mod2</title>
<desc id="desc">Instrument TX to L3, R2 to GPIO26; instrument ground directly to GND-J. Module R3/R4 supplied through ESP32 J2-1 / J3-7. L1 has no extra ground wire.</desc>
<rect width="930" height="365" fill="white"/>
<g font-family="Arial,sans-serif">
<path d="M190 65 L330 65" stroke="#37474f" stroke-width="2.5" fill="none"/>
<path d="M570 65 L720 65" stroke="#37474f" stroke-width="2.5" fill="none"/>
<path d="M190 140 L250 140 L250 242 L330 242" stroke="#171717" stroke-width="2.5" fill="none" stroke-dasharray="7 5"/>
<path d="M720 235 L675 235 L675 115 L570 115" stroke="#8e24aa" stroke-width="2.5" fill="none"/>
<path d="M570 85 L625 85 L625 115" stroke="#8e24aa" stroke-width="2.5" fill="none"/>
<path d="M720 270 L650 270 L650 160 L570 160" stroke="#171717" stroke-width="2.5" fill="none"/>
<path d="M30 320 H60" stroke="#37474f" stroke-width="2.5"/>
<path d="M268 320 H298" stroke="#171717" stroke-width="2.5" stroke-dasharray="7 5"/>
<path d="M429 320 H459" stroke="#171717" stroke-width="2.5"/>
<path d="M590 320 H620" stroke="#8e24aa" stroke-width="2.5"/>
<polygon points="256,60 256,70 265,65" fill="#37474f"/>
<polygon points="686,60 686,70 695,65" fill="#37474f"/>
<circle cx="625" cy="115" r="4" fill="#8e24aa"/>
<rect x="20" y="40" width="170" height="130" rx="5" fill="#eaf1fb" stroke="#9cb1cc" stroke-width="1.5"/>
<rect x="330" y="40" width="240" height="130" rx="5" fill="#eaf1fb" stroke="#9cb1cc" stroke-width="1.5"/>
<rect x="720" y="40" width="190" height="90" rx="5" fill="#eaf1fb" stroke="#9cb1cc" stroke-width="1.5"/>
<rect x="330" y="210" width="240" height="65" rx="5" fill="#eaf1fb" stroke="#9cb1cc" stroke-width="1.5"/>
<rect x="720" y="210" width="190" height="80" rx="5" fill="#eaf1fb" stroke="#9cb1cc" stroke-width="1.5"/>
<rect x="620.0" y="87.0" width="10" height="26" fill="white" stroke="#8e24aa" stroke-width="2"/>
<text x="105.0" y="101.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">Classic FLARM</text>
<text x="105.0" y="119.0" font-size="12" fill="#475569" text-anchor="middle">existing harness / DE-9</text>
<text x="450.0" y="101.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">RS-232-mod2</text>
<text x="450.0" y="119.0" font-size="12" fill="#475569" text-anchor="middle">RS-232 / 3.3 V TTL</text>
<text x="815.0" y="81.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">ESP32</text>
<text x="815.0" y="99.0" font-size="12" fill="#475569" text-anchor="middle">GPIO26</text>
<text x="260" y="57" font-size="12" fill="#37474f" text-anchor="middle" font-weight="700">pin 5 TX → L3</text>
<text x="645" y="57" font-size="12" fill="#37474f" text-anchor="middle" font-weight="700">R2 → GPIO26</text>
<text x="450.0" y="238.5" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">Central GND-J</text>
<text x="450.0" y="256.5" font-size="12" fill="#475569" text-anchor="middle">instrument ground branch</text>
<text x="245" y="132" font-size="11" fill="#171717" text-anchor="end" font-weight="700">signal GND</text>
<text x="815.0" y="237.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">ESP32 J2-1 / J3-7</text>
<text x="815.0" y="255.0" font-size="12" fill="#475569" text-anchor="middle">3V3 / R3</text>
<text x="815.0" y="273.0" font-size="12" fill="#475569" text-anchor="middle">GND / R4</text>
<text x="580" y="108" font-size="11" fill="#8e24aa" text-anchor="start" font-weight="700">R3</text>
<text x="620" y="145" font-size="11" fill="#8e24aa" text-anchor="middle" font-weight="700">R-F 10 kΩ</text>
<text x="580" y="155" font-size="11" fill="#171717" text-anchor="start" font-weight="700">R4</text>
<text x="66" y="324" font-size="12" fill="#172b4d" text-anchor="start">Data (arrow = direction)</text>
<text x="304" y="324" font-size="12" fill="#172b4d" text-anchor="start">Signal ground</text>
<text x="465" y="324" font-size="12" fill="#172b4d" text-anchor="start">Bridge ground</text>
<text x="626" y="324" font-size="12" fill="#172b4d" text-anchor="start">3.3 V</text>
<text x="30" y="344" font-size="12" fill="#475569" text-anchor="start">Receive only. Supply/return chain: ESP32 → mod2 → mod1; boards remain electrically parallel.</text>
</g>
</svg>
