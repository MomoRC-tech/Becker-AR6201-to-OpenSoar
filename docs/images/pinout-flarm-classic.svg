<title id="title">Classic FLARM · Power/Data RJ45</title>
<desc id="desc">Manual v221 contact-side plug view, latch down. IGC numbering 8 to 1 left to right. Pins 1 and 2 supply in, 3 3 V output, 4 7 and 8 GND, 5 TX, 6 RX. Installed cable match UNKNOWN.</desc>
