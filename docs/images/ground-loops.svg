<svg xmlns="http://www.w3.org/2000/svg" width="930" height="510" viewBox="0 0 930 510" role="img" aria-labelledby="title desc">
<title id="title">Bridge power and ground loops</title>
<desc id="desc">The battery feeds the bridge (F1, UBEC, ESP32 with MAX490 and RS-232 modules) and each device with +12 V. The battery minus, the bridge ground and each device's supply ground meet at the common ground point. Dashed signal grounds from the bridge to the Becker (J1-21), Zander (pin 5) and FLARM (pins 7/8) each close a ground loop: Loop B, Loop Z and Loop F.</desc>
<rect width="930" height="510" fill="white"/>
<g font-family="Arial,sans-serif">

<!-- Bridge group outline -->
<rect x="200" y="50" width="270" height="320" rx="8" fill="#f7f9fc" stroke="#9cb1cc" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="214" y="70" font-size="13" font-weight="700" fill="#172b4d">Bridge</text>

<!-- Supply lines -->
<g stroke="#d32f2f" stroke-width="2.5" fill="none">
  <path d="M95 70V46"/>
  <path d="M335 24V80"/>
  <path d="M335 116V140"/>
  <path d="M810 86H835"/>
  <path d="M810 201H835"/>
  <path d="M810 316H835"/>
</g>
<path d="M335 176V220" stroke="#ef6c00" stroke-width="2.5" fill="none"/>

<!-- Supply grounds -->
<g stroke="#616161" stroke-width="2.5" fill="none">
  <path d="M95 126V440"/>
  <path d="M335 330V440"/>
  <path d="M810 112H900"/>
  <path d="M810 227H900"/>
  <path d="M810 342H900"/>
  <path d="M900 112V440"/>
</g>
<path d="M95 440H900" stroke="#616161" stroke-width="4" fill="none"/>
<g fill="#616161"><circle cx="95" cy="440" r="5"/><circle cx="335" cy="440" r="5"/><circle cx="900" cy="440" r="5"/><circle cx="900" cy="227" r="4"/><circle cx="900" cy="342" r="4"/></g>

<!-- Signal grounds (loops) -->
<g stroke="#1e88e5" stroke-width="2.5" stroke-dasharray="7 5" fill="none">
  <path d="M445 240H560V98H660"/>
  <path d="M445 275H580V213H660"/>
  <path d="M445 310H660"/>
</g>

<!-- Boxes -->
<g fill="#eaf1fb" stroke="#9cb1cc" stroke-width="1.5">
  <rect x="30" y="70" width="130" height="56" rx="5"/>
  <rect x="245" y="80" width="180" height="36" rx="5"/>
  <rect x="245" y="140" width="180" height="36" rx="5"/>
  <rect x="225" y="220" width="220" height="110" rx="5"/>
  <rect x="660" y="70" width="150" height="56" rx="5"/>
  <rect x="660" y="185" width="150" height="56" rx="5"/>
  <rect x="660" y="300" width="150" height="56" rx="5"/>
</g>

<!-- Box labels -->
<g font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">
  <text x="95" y="95">Battery</text>
  <text x="335" y="103">F1 fuse</text>
  <text x="335" y="163">UBEC 5 V</text>
  <text x="335" y="258">ESP32</text>
  <text x="735" y="103">Becker AR6201</text>
  <text x="735" y="218">Zander ZS1</text>
  <text x="735" y="333">FLARM</text>
</g>
<g font-size="12" fill="#475569" text-anchor="middle">
  <text x="95" y="113">12 V</text>
  <text x="335" y="278">MAX490 board</text>
  <text x="335" y="296">RS-232 modules</text>
</g>

<!-- Line labels -->
<g font-size="12" fill="#d32f2f" font-weight="700">
  <text x="95" y="40" text-anchor="middle">+12 V</text>
  <text x="343" y="34">+12 V</text>
  <text x="840" y="90">+12 V</text>
  <text x="840" y="205">+12 V</text>
  <text x="840" y="320">+12 V</text>
</g>
<text x="343" y="203" font-size="12" fill="#ef6c00" font-weight="700">5 V / 3.3 V</text>
<g font-size="11" fill="#616161">
  <text x="845" y="106">P1-13/25</text>
  <text x="845" y="221">GND</text>
  <text x="845" y="336">GND</text>
  <text x="343" y="405">Bridge GND</text>
  <text x="103" y="160">Battery −</text>
</g>
<g font-size="12" fill="#1565c0" font-weight="700" text-anchor="middle">
  <text x="610" y="91">Loop B · J1-21</text>
  <text x="614" y="206">Loop Z · pin 5</text>
  <text x="600" y="303">Loop F · pins 7/8</text>
</g>
<text x="497" y="462" font-size="13" fill="#424242" text-anchor="middle" font-weight="700">Common ground point (battery −)</text>

<!-- Legend -->
<g stroke-width="2.5" fill="none">
  <path d="M30 492H60" stroke="#d32f2f"/>
  <path d="M170 492H200" stroke="#ef6c00"/>
  <path d="M330 492H360" stroke="#616161"/>
  <path d="M500 492H530" stroke="#1e88e5" stroke-dasharray="7 5"/>
</g>
<g font-size="12" fill="#172b4d">
  <text x="66" y="496">+12 V supply</text>
  <text x="206" y="496">5 V / 3.3 V in bridge</text>
  <text x="366" y="496">Supply ground</text>
  <text x="536" y="496">Signal ground, closes a loop</text>
</g>
</g>
</svg>
