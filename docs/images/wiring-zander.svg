<svg xmlns="http://www.w3.org/2000/svg" width="930" height="250" viewBox="0 0 930 250" role="img" aria-labelledby="title desc">
<title id="title">Zander ZS1 to RS-232 module to ESP32</title>
<desc id="desc">Zander TX to pad L3, TTL output R2 to GPIO32 (UART0 receive). Signal ground to pads L1 and R4 and ESP32 GND. ESP32 3V3 to pad R3; R-Z (10 kΩ) on the module from pad R1 to pad R3. Receive only.</desc>
<rect width="930" height="250" fill="white"/>
<g font-family="Arial,sans-serif">
<path d="M190 70 L340 70" stroke="#37474f" stroke-width="2.5" fill="none"/>
<path d="M560 70 L710 70" stroke="#37474f" stroke-width="2.5" fill="none"/>
<path d="M190 145 L340 145" stroke="#1e88e5" stroke-width="2.5" fill="none" stroke-dasharray="7 5"/>
<path d="M560 95 L640 95 L640 130" stroke="#8e24aa" stroke-width="2.5" fill="none"/>
<path d="M710 130 L560 130" stroke="#8e24aa" stroke-width="2.5" fill="none"/>
<path d="M560 160 L710 160" stroke="#616161" stroke-width="2.5" fill="none"/>
<path d="M30 215 H60" stroke="#37474f" stroke-width="2.5"/>
<path d="M268 215 H298" stroke="#1e88e5" stroke-width="2.5" stroke-dasharray="7 5"/>
<path d="M429 215 H459" stroke="#616161" stroke-width="2.5"/>
<path d="M590 215 H620" stroke="#8e24aa" stroke-width="2.5"/>
<polygon points="261,65 261,75 270,70" fill="#37474f"/>
<polygon points="631,65 631,75 640,70" fill="#37474f"/>
<polygon points="694,125 694,135 685,130" fill="#8e24aa"/>
<circle cx="640" cy="130" r="4" fill="#8e24aa"/>
<rect x="20" y="40" width="170" height="130" rx="5" fill="#eaf1fb" stroke="#9cb1cc" stroke-width="1.5"/>
<rect x="340" y="40" width="220" height="130" rx="5" fill="#eaf1fb" stroke="#9cb1cc" stroke-width="1.5"/>
<rect x="710" y="40" width="200" height="130" rx="5" fill="#eaf1fb" stroke="#9cb1cc" stroke-width="1.5"/>
<rect x="635.0" y="99.0" width="10" height="26" fill="white" stroke="#8e24aa" stroke-width="2"/>
<text x="105.0" y="101.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">Zander ZS1</text>
<text x="105.0" y="119.0" font-size="12" fill="#475569" text-anchor="middle">existing harness, via DE-9</text>
<text x="450.0" y="92.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">RS-232-mod1</text>
<text x="450.0" y="110.0" font-size="12" fill="#475569" text-anchor="middle">RS-232 ↔ 3.3 V TTL</text>
<text x="450.0" y="128.0" font-size="12" fill="#475569" text-anchor="middle">pads R1–R4 at right</text>
<text x="810.0" y="83.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">ESP32</text>
<text x="810.0" y="101.0" font-size="12" fill="#475569" text-anchor="middle">GPIO32 · UART0 RX</text>
<text x="810.0" y="119.0" font-size="12" fill="#475569" text-anchor="middle">3V3 (J2-1)</text>
<text x="810.0" y="137.0" font-size="12" fill="#475569" text-anchor="middle">GND</text>
<text x="265" y="62" font-size="12" fill="#37474f" text-anchor="middle" font-weight="700">TX → L3</text>
<text x="635" y="62" font-size="12" fill="#37474f" text-anchor="middle" font-weight="700">R2 → GPIO32</text>
<text x="265" y="137" font-size="12" fill="#1e88e5" text-anchor="middle" font-weight="700">Signal GND → L1</text>
<text x="566" y="90" font-size="11" fill="#8e24aa" text-anchor="start" font-weight="700">R1</text>
<text x="630" y="116" font-size="11" fill="#8e24aa" text-anchor="end">R-Z 10 kΩ</text>
<text x="682" y="123" font-size="11" fill="#8e24aa" text-anchor="middle" font-weight="700">3V3 → R3</text>
<text x="600" y="155" font-size="11" fill="#616161" text-anchor="middle" font-weight="700">R4 → GND</text>
<text x="66" y="219" font-size="12" fill="#172b4d" text-anchor="start">Data (arrow = direction)</text>
<text x="304" y="219" font-size="12" fill="#172b4d" text-anchor="start">Signal ground</text>
<text x="465" y="219" font-size="12" fill="#172b4d" text-anchor="start">Bridge ground</text>
<text x="626" y="219" font-size="12" fill="#172b4d" text-anchor="start">3.3 V</text>
<text x="30" y="239" font-size="12" fill="#475569" text-anchor="start">Receive only: L4 and GPIO33 stay unconnected. Supply via the 3.3 V rail (see power).</text>
</g>
</svg>
