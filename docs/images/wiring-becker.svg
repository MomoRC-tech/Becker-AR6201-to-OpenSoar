<text x="30" y="504">*J1 numbers: conditional manual reference. View/orientation unverified; no contact locations implied.</text>
<text x="30" y="530">TX link contacts UNKNOWN. Open link ≠ disabled driver. Termination/shielding UNKNOWN.</text>
<text x="30" y="556">Signal proposal only; protection and local components omitted. Commands are required for standby tuning.</text>
<text x="30" y="582" font-size="13">Prior review: Becker DV14307.03 Issue 06, p.59; THVD1451D SLLSEY3E Rev. E, p.6. No hardware validation.</text>
