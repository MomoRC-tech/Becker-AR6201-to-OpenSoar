<text x="105.0" y="112.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">Becker J1</text>
<text x="105.0" y="130.0" font-size="12" fill="#475569" text-anchor="middle">radio rear</text>
<text x="105.0" y="148.0" font-size="12" fill="#475569" text-anchor="middle">harness via DE-9</text>
<text x="425.0" y="112.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">MAX490 board</text>
<text x="425.0" y="130.0" font-size="12" fill="#475569" text-anchor="middle">A B Y Z | RO DI</text>
<text x="425.0" y="148.0" font-size="12" fill="#475569" text-anchor="middle">5 V, 120 Ω term.</text>
<text x="885.0" y="121.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">ESP32</text>
<text x="885.0" y="139.0" font-size="12" fill="#475569" text-anchor="middle">UART2</text>
<text x="260" y="48" font-size="12" fill="#37474f" text-anchor="middle">2 TX2+ → A</text>
<text x="260" y="73" font-size="12" fill="#37474f" text-anchor="middle">9 TX2− → B</text>
<text x="260" y="108" font-size="12" fill="#37474f" text-anchor="middle">3 RX2+ ← Y</text>
<text x="260" y="133" font-size="12" fill="#37474f" text-anchor="middle">10 RX2− ← Z</text>
<text x="285" y="232" font-size="11" fill="#171717" text-anchor="start">21 → GND-J</text>
<text x="198" y="198" font-size="11" fill="#9e9e9e" text-anchor="start">11 shield, radio end only</text>
<text x="740" y="38" font-size="12" fill="#8e24aa" text-anchor="middle" font-weight="700">3V3 (J2-1)</text>
<text x="630" y="69" font-size="12" fill="#8e24aa" text-anchor="end" font-weight="700">R-D 10 kΩ</text>
<text x="745" y="78" font-size="12" fill="#37474f" text-anchor="middle" font-weight="700">DI ← GPIO17 (J3-11)</text>
<text x="527" y="128" font-size="12" fill="#37474f" text-anchor="start" font-weight="700">RO</text>
<text x="600" y="124" font-size="12" fill="#37474f" text-anchor="middle">R-B1 2.2 kΩ</text>
<text x="765" y="128" font-size="11" fill="#37474f" text-anchor="middle" font-weight="700">GPIO16 (J3-12)</text>
<text x="730" y="169" font-size="12" fill="#37474f" text-anchor="start">R-B2 3.3 kΩ</text>
<text x="765" y="188" font-size="11" fill="#171717" text-anchor="middle" font-weight="700">local J3-7</text>
<text x="555" y="215" font-size="11" fill="#171717" text-anchor="middle" font-weight="700">to GND-J</text>
<text x="66" y="259" font-size="12" fill="#172b4d" text-anchor="start">Data (arrow = direction)</text>
<text x="304" y="259" font-size="12" fill="#172b4d" text-anchor="start">Signal ground</text>
<text x="465" y="259" font-size="12" fill="#172b4d" text-anchor="start">Bridge ground</text>
<text x="626" y="259" font-size="12" fill="#172b4d" text-anchor="start">Cable shield</text>
<text x="780" y="259" font-size="12" fill="#172b4d" text-anchor="start">3.3 V</text>
<text x="30" y="279" font-size="12" fill="#475569" text-anchor="start">Twisted pairs: TX2± and RX2±. VCC from 5V-J; GND from GND-J. No extra MAX490-to-ESP32 GND wire.</text>
</g>
</svg>
