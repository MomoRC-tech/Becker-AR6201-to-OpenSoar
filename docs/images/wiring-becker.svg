<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" role="img" aria-labelledby="title desc">
<title id="title">Becker to RS-422 board to ESP32</title>
<desc id="desc">Becker J1 TX2+ and TX2- (pins 2, 9) to MAX490 receiver inputs A and B; MAX490 driver outputs Y and Z to J1 RX2+ and RX2- (pins 3, 10). J1-21 D_GND to the board GND. Cable shield to J1-11 at the radio end only. Receiver output RO through a 2.2 kΩ / 3.3 kΩ divider to GPIO16; GPIO17 to driver input DI with a 10 kΩ pull-up R-D to 3.3 V. Board VCC 5 V from the ESP32 5V pin.</desc>
