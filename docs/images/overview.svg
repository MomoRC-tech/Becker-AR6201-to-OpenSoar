<text x="170.0" y="54.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">Vario: Zander ZS1</text>
<text x="170.0" y="72.0" font-size="12" fill="#475569" text-anchor="middle">sends flight data</text>
<text x="170.0" y="134.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">Collision warning: Classic FLARM</text>
<text x="170.0" y="152.0" font-size="12" fill="#475569" text-anchor="middle">sends traffic</text>
<text x="170.0" y="214.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">Radio: Becker AR6201</text>
<text x="170.0" y="232.0" font-size="12" fill="#475569" text-anchor="middle">standby frequency in, status out</text>
<text x="495.0" y="149.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">Wi-Fi bridge</text>
<text x="495.0" y="167.0" font-size="12" fill="#475569" text-anchor="middle">ESP32</text>
<text x="780.0" y="149.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">Navigation: OpenSoar</text>
<text x="780.0" y="167.0" font-size="12" fill="#475569" text-anchor="middle">Android</text>
<text x="630" y="143" font-size="12" fill="#00897b" text-anchor="middle" font-weight="700">Wi-Fi</text>
