<svg xmlns="http://www.w3.org/2000/svg" width="900" height="345" viewBox="0 0 900 345" role="img" aria-labelledby="title desc">
<title id="title">What the bridge does</title>
<desc id="desc">Glider computer Zander ZS1 sends flight data and collision warning Classic FLARM sends traffic to the Wi-Fi bridge. The radio Becker AR6201 exchanges standby frequency and status with the bridge in both directions. The bridge connects to the navigation app OpenSoar on Android over Wi-Fi.</desc>
<rect width="900" height="345" fill="white"/>
<g font-family="Arial,sans-serif">
