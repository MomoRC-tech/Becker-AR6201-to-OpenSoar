<rect x="680" y="122" width="200" height="56" rx="5" fill="#eaf1fb" stroke="#9cb1cc" stroke-width="1.5"/>
<text x="170.0" y="44.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">Glider computer:</text>
<text x="170.0" y="62.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">Zander ZS1</text>
<text x="170.0" y="80.0" font-size="12" fill="#475569" text-anchor="middle">sends flight data</text>
<text x="170.0" y="137.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">Collision warning:</text>
<text x="170.0" y="155.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">Classic FLARM</text>
<text x="170.0" y="173.0" font-size="12" fill="#475569" text-anchor="middle">sends traffic</text>
<text x="170.0" y="230.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">Radio:</text>
<text x="170.0" y="248.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">Becker AR6201</text>
<text x="170.0" y="266.0" font-size="12" fill="#475569" text-anchor="middle">standby frequency in, status out</text>
<text x="495.0" y="146.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">Wi-Fi bridge:</text>
<text x="495.0" y="164.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">ESP32</text>
<text x="780.0" y="146.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">Navigation:</text>
<text x="780.0" y="164.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">OpenSoar (Android)</text>
<text x="630" y="140" font-size="12" fill="#00897b" text-anchor="middle" font-weight="700">Wi-Fi</text>
<text x="66" y="314" font-size="12" fill="#172b4d" text-anchor="start">Data (arrow = direction)</text>
<text x="304" y="314" font-size="12" fill="#172b4d" text-anchor="start">Wi-Fi</text>
<text x="30" y="334" font-size="12" fill="#475569" text-anchor="start">Pins, levels and power: see the hardware pages.</text>
