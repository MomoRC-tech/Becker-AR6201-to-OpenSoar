<text x="105.0" y="218.5" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">UBEC output GND</text>
<text x="105.0" y="236.5" font-size="12" fill="#475569" text-anchor="middle">through existing ferrite</text>
<text x="320.0" y="218.5" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">GND-J</text>
<text x="320.0" y="236.5" font-size="12" fill="#475569" text-anchor="middle">insulated junction</text>
<text x="605.0" y="61.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">ESP32</text>
<text x="605.0" y="79.0" font-size="12" fill="#475569" text-anchor="middle">J2-14 main return</text>
<text x="605.0" y="141.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">MAX490</text>
<text x="605.0" y="159.0" font-size="12" fill="#475569" text-anchor="middle">own GND branch</text>
<text x="605.0" y="221.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">Becker signal GND</text>
<text x="605.0" y="239.0" font-size="12" fill="#475569" text-anchor="middle">via DE-9; J1-21</text>
<text x="605.0" y="301.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">Zander signal GND</text>
<text x="605.0" y="319.0" font-size="12" fill="#475569" text-anchor="middle">via DE-9</text>
<text x="605.0" y="381.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">FLARM signal GND</text>
<text x="605.0" y="399.0" font-size="12" fill="#475569" text-anchor="middle">via DE-9</text>
<text x="835.0" y="61.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">RS-232-mod2</text>
<text x="835.0" y="79.0" font-size="12" fill="#475569" text-anchor="middle">R4</text>
<text x="1025.0" y="61.0" font-size="14" fill="#172b4d" text-anchor="middle" font-weight="700">RS-232-mod1</text>
<text x="1025.0" y="79.0" font-size="12" fill="#475569" text-anchor="middle">R4</text>
<text x="730" y="30" font-size="11" fill="#171717" text-anchor="middle" font-weight="700">J3-7</text>
<text x="930" y="30" font-size="11" fill="#171717" text-anchor="middle" font-weight="700">R4 link</text>
<text x="790" y="120" font-size="12" fill="#172b4d" text-anchor="start">R-B2 stays on ESP32 J3-7.</text>
<text x="790" y="145" font-size="12" fill="#172b4d" text-anchor="start">No extra RS-232 L1 ground wires.</text>
<text x="790" y="170" font-size="12" fill="#172b4d" text-anchor="start">5V-J is a separate electrical node.</text>
<text x="66" y="454" font-size="12" fill="#172b4d" text-anchor="start">Bridge ground</text>
<text x="30" y="474" font-size="12" fill="#475569" text-anchor="start">Internal wiring tree only. Instrument supply grounds still create external return paths; see ground-loops.svg.</text>
