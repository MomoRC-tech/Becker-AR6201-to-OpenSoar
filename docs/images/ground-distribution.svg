<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="490" viewBox="0 0 1120 490" role="img" aria-labelledby="title desc">
<title id="title">Internal ground tree</title>
<desc id="desc">UBEC output ground through the ferrite to GND-J. Separate branches to ESP32, MAX490 and each instrument signal ground. ESP32 J3-7 feeds RS-232-mod2 R4 then mod1 R4. R-B2 remains local. No additional module-to-junction or MAX490-to-ESP32 ground links.</desc>
