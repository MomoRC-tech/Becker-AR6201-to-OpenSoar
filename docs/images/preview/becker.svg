<text x="44" y="635" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#764b00" text-anchor="start">Two wires per pair. Commands required for standby tuning; receive-only is a reduced mode.</text>
<text x="44" y="660" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#764b00" text-anchor="start">Keep radio unplugged. TX link contacts, termination, shielding and reference bonding UNKNOWN.</text>
<text x="44" y="685" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#764b00" text-anchor="start">Always-enabled transceiver; no galvanic isolation. Supply: IC 1 VCC / IC 4 GND; contacts UNKNOWN.</text>
<text x="28" y="738" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#485a69" text-anchor="start">Prior review: S10 · Becker DV14307.03 Issue 06, p.59; S18 · THVD1451D Rev. E, p.6. See README.preview.md.</text>
