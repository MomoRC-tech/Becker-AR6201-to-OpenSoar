<title id="title">Proposed bridge system overview</title><desc id="desc">One new ESP32 bridge with separate Zander and FLARM RS-232 paths and a proposed Becker RS-422 path, connected over Wi-Fi to OpenSoar Android. Navigation return paths conditional.</desc>
