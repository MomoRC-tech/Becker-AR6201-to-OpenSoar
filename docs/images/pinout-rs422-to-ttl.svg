<svg xmlns="http://www.w3.org/2000/svg" width="560" height="326" viewBox="0 0 560 326" role="img" aria-labelledby="title desc">
  <title id="title">RS422 TO TTL · chip side</title>
  <desc id="desc">With the TTL header at the top, left to right: TXD input, RXD output, GND, VCC 5 V. Bottom screw terminals, left to right: Y and Z driver outputs, B and A receiver inputs. Verify the installed board and logic levels.</desc>
  <rect width="560" height="326" rx="8" fill="#fff"/>
  <g font-family="Arial,sans-serif" fill="#1d2b37">
    <text x="18" y="29" font-size="21" font-weight="700">RS422 TO TTL · chip side</text>
    <text x="18" y="52" font-size="15" fill="#475569">Orient as pictured · module labels and directions (S28–S29)</text>
    <rect x="75" y="119" width="410" height="114" rx="8" fill="#f0f4f8" stroke="#778695"/>
    <g text-anchor="middle">
      <text x="280" y="77" font-size="16" font-weight="700">TTL header</text>
      <g font-size="14">
        <text x="115" y="100">Module input</text>
        <text x="225" y="100">Module output</text>
        <text x="335" y="100">Logic ground</text>
        <text x="445" y="100">5 V supply</text>
      </g>
      <rect x="83" y="107" width="64" height="27" rx="5" fill="#914018"/>
      <rect x="193" y="107" width="64" height="27" rx="5" fill="#155b8a"/>
      <rect x="303" y="107" width="64" height="27" rx="5" fill="#465466"/>
      <rect x="413" y="107" width="64" height="27" rx="5" fill="#7d2866"/>
      <text x="280" y="181" font-size="16" font-weight="700">MAX490ESA</text>
      <rect x="83" y="219" width="64" height="27" rx="5" fill="#155b8a"/>
      <rect x="193" y="219" width="64" height="27" rx="5" fill="#155b8a"/>
      <rect x="303" y="219" width="64" height="27" rx="5" fill="#914018"/>
      <rect x="413" y="219" width="64" height="27" rx="5" fill="#914018"/>
      <g font-size="15" font-weight="700" fill="#fff">
        <text x="115" y="126">TXD</text>
        <text x="225" y="126">RXD</text>
        <text x="335" y="126">GND</text>
        <text x="445" y="126">VCC</text>
        <text x="115" y="238">Y</text>
        <text x="225" y="238">Z</text>
        <text x="335" y="238">B</text>
        <text x="445" y="238">A</text>
      </g>
      <text x="170" y="267" font-size="15">Driver outputs</text>
      <text x="390" y="267" font-size="15">Receiver inputs</text>
      <text x="280" y="292" font-size="16" font-weight="700">RS-422 screw terminals</text>
    </g>
    <text x="18" y="314" font-size="15" fill="#475569">Verify the board and logic levels before connecting.</text>
  </g>
</svg>
