<svg xmlns="http://www.w3.org/2000/svg" width="560" height="350" viewBox="0 0 560 350" role="img" aria-labelledby="title desc">
<title id="title">RS422 TO TTL · component side</title>
<desc id="desc">Component-side view, header at top. Header left to right: TXD, RXD, GND, VCC. TXD/RXD are printed labels, not a verified RO/DI assignment. Bottom screw terminals left to right: Y driver output positive, Z driver output negative, B receiver input negative, A receiver input positive. Supply is 5 V.</desc>
<rect width="560" height="350" fill="white"/>
