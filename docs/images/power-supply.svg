<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
<title id="title">Bridge supply path</title>
<desc id="desc">12 V from the harness through the XT30 connector and fuse F1 to the UBEC. The UBEC's 5 V feeds the ESP32 board's 5V pin; a second wire from that pin feeds the MAX490 board. The ESP32 board's 3.3 V regulator feeds both RS-232 modules (with their pull-ups R-Z and R-F on the module) and the pull-up R-D. Arrows show current direction.</desc>
