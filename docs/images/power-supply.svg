<title id="title">Bridge supply distribution</title>
<desc id="desc">UBEC output through the existing ferrite to 5V-J, with separate branches to ESP32 and MAX490. ESP32 3.3 V feeds RS-232-mod2 then mod1, electrically in parallel, and R-D. Grounds are shown separately.</desc>
