<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-labelledby="title desc">
<title id="title">Bridge supply distribution</title>
<desc id="desc">UBEC output through the existing ferrite to 5V-J, with separate branches to ESP32 and MAX490. ESP32 3.3 V feeds RS-232-mod2 then mod1, electrically in parallel; R-D takes 3.3 V from the mod2 L2 pad. The 12 V input feeds the voltage divider R-V1 100 kOhm and R-V2 10 kOhm with C-V 100 nF to GPIO34. Grounds are shown separately.</desc>
