  <line x1="791" y1="282" x2="959" y2="282" class="divider"/>
  <rect x="14" y="51" width="198" height="105" rx="10" class="card"/>
  <text x="26" y="74" class="heading">Zander ZS1</text>
  <text x="26" y="92" class="sub">PC cable D-sub</text>
  <rect x="253" y="51" width="222" height="105" rx="10" class="card"/>
  <text x="265" y="74" class="heading">RS-232 converter</text>
  <text x="265" y="92" class="sub">Functional terminals</text>
  <text x="528" y="74" class="sub">UART0</text>
  <text x="792" y="74" class="sub">Zander ZS1 connection</text>
  <rect x="57" y="95" width="155" height="26" rx="4" class="pin"/>
  <text x="134.5" y="113" class="label" text-anchor="middle">Pin 2 · TX (Z1)</text>
