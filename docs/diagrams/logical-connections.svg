<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 984 492" role="img" aria-labelledby="title desc">
  <title id="title">Logical connections</title>
  <desc id="desc">Zander, FLARM and Becker pins at left connect to converter terminals and ESP32 UART pins. OpenSoar endpoints are at right. Dashed arrows indicate reserved navigation return paths.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #17243b; }
    .heading { font-size: 18px; font-weight: 700; }
    .sub { font-size: 13px; fill: #43516a; }
    .label { font-size: 14px; font-weight: 600; }
    .card { fill: #edf2fa; stroke: #9caec7; }
    .pin { fill: #fff; stroke: #556e91; }
    .wire { stroke: #354f73; stroke-width: 2; }
    .pending { stroke-dasharray: 5 4; }
    .divider { stroke: #b6c4d8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#354f73"/>
    </marker>
  </defs>
  <rect width="984" height="492" rx="12" fill="#fff"/>
  <rect x="516" y="14" width="223" height="432" rx="10" class="card"/>
  <text x="528" y="37" class="heading">One ESP32</text>
  <text x="528" y="55" class="sub">DevKitC V4 · WROOM-32E</text>
